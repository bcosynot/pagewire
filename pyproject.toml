[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagewire"
version = "0.0.1"
description = "Relay reading sessions from a Crosspoint e-reader to Readwise Books and Hardcover"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# No runtime dependencies yet: this is the skeleton. The relay's HTTP layer and its
# two destination clients arrive with their own tickets, and their dependencies are
# declared here as they land rather than speculatively.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
