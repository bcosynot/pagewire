[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagewire"
version = "0.0.1"
description = "Relay reading sessions from a Crosspoint e-reader to Readwise Books and Hardcover"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  # TestClient is built on httpx, which FastAPI does not pull in for you.
  "httpx>=0.27",
]

[project.scripts]
# What the NixOS module starts. Keep these stable: they are named in the systemd units
# and in docs/evidence/per-46-deploy/.
pagewire-serve = "pagewire.app:serve"
pagewire-derive = "pagewire.sessions:main"
pagewire-deliver = "pagewire.delivery:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
